<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>UMS</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>body{font-family:Segoe UI,Tahoma,sans-serif;background:#f4f6f9;color:#1b2430;display:grid;place-items:center;height:100vh;margin:0}
.c{background:#fff;border-radius:14px;box-shadow:0 6px 30px #0002;padding:28px 32px;max-width:520px}h2{margin-top:0}
button{font:inherit;padding:9px 18px;border-radius:8px;border:1px solid #9aa7b8;background:#fff;cursor:pointer;margin-inline-end:8px}button.p{background:#1d5fd1;color:#fff;border-color:#1d5fd1}
input{width:100%;box-sizing:border-box;font:inherit;padding:8px;direction:ltr;margin:8px 0}#u{direction:ltr;word-break:break-all;color:#555}</style></head><body><div class="c">
<h2>تعذر الاتصال بالمخدم</h2><p>تحقق من الإنترنت أو من اتصال VPN ثم أعد المحاولة. تتم إعادة المحاولة تلقائياً كل دقيقة.</p><p>العنوان الحالي:</p><div id="u"></div>
<div id="chg" hidden><input id="in" placeholder="https://..."><button class="p" id="save">حفظ وفتح</button></div>
<p><button class="p" id="r">إعادة المحاولة</button><button id="c">تغيير العنوان</button><button id="x">إغلاق</button></p><p id="m" style="color:#b00"></p></div>
<script>
const $=(i)=>document.getElementById(i);
window.UMSDesktop.getServer().then(u=>{$("u").textContent=u;$("in").value=u});
$("r").onclick=()=>window.UMSDesktop.retry();$("x").onclick=()=>window.UMSDesktop.close();
$("c").onclick=()=>{$("chg").hidden=false};
$("save").onclick=async()=>{const ok=await window.UMSDesktop.setServer($("in").value);if(!ok)$("m").textContent="يجب أن يبدأ العنوان بـ https://"};
</script></body></html>
