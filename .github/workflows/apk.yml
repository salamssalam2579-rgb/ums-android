name: Build UMS APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم إصدار النظام (مثل 5.9.2) كما في package.json"
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK (مثبّت مسبقاً على الخادم، نضيف الحزم المطلوبة فقط)
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.5" }
      - name: Build
        env:
          VER: ${{ inputs.version }}
          DISC: ${{ secrets.DISCOVERY_URL }}
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -e
          [ -n "$DISC" ] && [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] || { echo "::error::ناقص أحد الأسرار: DISCOVERY_URL / KS_B64 / KS_PASS"; exit 1; }
          echo "::add-mask::$DISC"
          URL=$(curl -fsS -m 20 "$DISC" | tr -d '[:space:]')
          echo "::add-mask::$URL"
          case "$URL" in https://*) ;; *) echo "::error::ملف الاكتشاف لا يحوي عنواناً صالحاً"; exit 1;; esac
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/ums.jks" || { echo "::error::السر KS_B64 غير صالح أو ناقص: أعد إنشاءه"; exit 1; }
          [ -s "$RUNNER_TEMP/ums.jks" ] && echo "حجم المفتاح: $(wc -c < "$RUNNER_TEMP/ums.jks") بايت"
          IFS=. read -r MA MI PA <<<"$VER"; CODE=$((MA*10000+MI*100+PA))
          cd project
          gradle --no-daemon assembleRelease -PserverUrl="$URL" -PdiscoveryUrl="$DISC" -Pvcode="$CODE" -Pvname="$VER" \
            -PksFile="$RUNNER_TEMP/ums.jks" -PksPass="$KS_PASS"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/UMS.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: UMS-apk
          path: UMS.apk
          retention-days: 30
